services:
  redis:
    image: redis:latest
#    platform: linux/amd64  # Arm
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  postgres:
    image: postgres:latest
#    platform: linux/amd64  # Arm
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_LOCAL_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  default_worker:
    build:
      context: .
    container_name: worker
    restart: always
    depends_on:
      - redis
      - postgres
    env_file: .env
    command: saq worker.run_worker.worker_settings --web
    networks:
      - app_network
    ports:
      - "8080:8080"

  bot:
    build: .
    container_name: bot
    restart: always
    command: python main.py
    depends_on:
      - redis
      - postgres
    env_file:
      - .env
    networks:
      - app_network

volumes:
  redis_data:
  postgres_data:

networks:
  app_network:
    driver: bridge